# The .NET SDK source pins — this factory's trust anchor. There is NO
# tamatebako source factory for .NET (and there never will be in this
# shape): Microsoft ships compiled per-RID SDK builds, so this factory
# REPACKS Microsoft's published archives (the node/openjdk grammar — no
# compilation). The sha256 recorded beside each url is verified at fetch
# time (a mismatch is a hard named error, never a refetch loop past the
# bounded retry); Microsoft's own published digest is sha512, recorded
# alongside as upstream_sha512 — the pin-time cross-check anchor (each
# recorded sha256 was computed from bytes first verified against it).
#
# Upstream index: https://builds.dotnet.microsoft.com/dotnet/release-metadata/
# releases-index.json → the 10.0 channel's releases.json (the latest LTS
# line, pinned 2026-11-23; release-type lts, support-phase active).
#
# contract.yml's dotnet.catalog selects which pinned versions the matrix
# builds; scripts/check_contract.rb locks the two (a catalog version with
# no pin, or a pin the catalog never builds, is a config bug).
#
# Per-triplet availability (verified against the 10.0 channel's
# releases.json 2026-11-23): Microsoft ships SDK archives for ALL SIX
# target triplets — linux-x64, linux-musl-x64, osx-arm64, osx-x64
# (tar.gz) and win-x64, win-arm64 (zip). Microsoft ALSO ships
# linux-arm64 and linux-musl-arm64 SDKs; those two triplets stay
# UNPINNED — no leg demands them yet, and a pin no leg consumes is
# config debt (their increment records them). The skeleton builds
# x86_64-linux-gnu only; the remaining pins are recorded so their legs
# are mechanical increments.
