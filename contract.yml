# Bootstrap <-> runtime contract version: the versioned protocol between
# the tebako bootstrap (released from tamatebako/tebako) and the runtime
# images published from this repo — the env vars passed down, the argv
# layout, and the filesystem-image handoff. Modeled on
# tebako-runtime-php's contract.yml (itself the python/ruby factories').
#
# This factory has NO contract-1 era: dotnet runtimes exist only in the
# image era, so contract_version is 2 from the first build (the schema
# floors it at 2 — contract 1 was the retired v1 C++ tebako-main.cpp
# grammar this factory never ships). Bump rules mirror the other
# factories': any change to env/argv/handoff semantics bumps the integer
# by exactly +1, here and in the consumed driver's compiled-in
# TEBAKO_CONTRACT_VERSION, in the same commit — scripts/check_contract.rb
# locks the two (the driver-source parity arm reads the pinned
# link_unit_release's crates/tebako-driver/src/lib.rs).
#
# Schema: schema/contract.schema.yml (validated by the same check).
---
contract_version: 2

# The published product line this factory consumes: the tamatebako/tebako
# release whose prebuilt wrapper exe (tebako-runtime-launcher — the spec-29
# process entry point with the spec-17 driver embedded), tfs CLI (the
# in-process imager), and link-unit tarball (the POSIX preload shim the
# layout's preload_shim grant stages) the legs CONSUME as sha256-verified
# downloads. This factory has NO source-build path for the driver stack —
# an empty pin, a missing asset, or a checksum MISMATCH are hard named
# errors, never a silent fallback (a supply-chain event is reported, not
# worked around). The asset digests live in `tools:` below.
#
# v2.8.83 (2026-11-17) is this factory's first pin: the current product
# line at skeleton time, carrying the spec-29 wrapper on every shipped
# platform, the exec-cache visibility tier (spec 22 §6) this runtime
# declares, and the entry-twin delivery (tebako#831). The pair's artifact
# names carry the line (tebako-runtime-2.8.83-dotnet-<sdk>-<platform> —
# the openjdk/node naming grammar), and the release tag convention is the
# trr one: the tag IS the tebako product line.
#
# v2.8.86 (2026-11-28): Rule E5 (the spawn app-dir materialization sweep,
# tebako#1141) ships in this line's embedded driver — a framework-dependent
# .NET entry's runtimeconfig/deps siblings ride the sweep beside the dll
# (hello-dotnet's press-time check, tebako-packages/hello-runtimes#44).
link_unit_release: "v2.8.86"

# The release machinery's pin (tebako-release — the publish/sign uploader
# + signer every runtime factory consumes; tamatebako/tebako-release-tooling
# is its single owner, ecosystem invariant 10). The Gemfile reads THIS key
# for its git tag, so a tooling bump is one contract edit, never a second
# hand-written copy of the machinery (the r factory's grammar).
release_tooling: "v0.5.3"

# The consumed toolchain, per tool-platform: the wrapper exe (the shipped
# runtime pair's process entry point), the tfs CLI (the imager), and the
# link-unit tarball (POSIX only — its libtfs_preload rides the image so
# the jail's host-IO binding survives the exec into the dotnet muxer, the
# openjdk grammar; the windows image omits the grant).
#
# Trust anchors: the wrapper and tfs digests are the release's own
# SHA256SUMS entries (verified at pin time, cross-checked at fetch time);
# the link-unit tarballs are NOT in that monolith, so the recorded digest
# — computed at pin time from the downloaded tarball — is their single
# anchor (the node/openjdk grammar). Only the platform(s) with build legs
# carry pins: a pin no leg consumes is config debt, so a new platform's
# pins land WITH its leg (README's follow-ups).
tools:
  repo: "tamatebako/tebako"
  sha256:
    wrapper:
      linux-gnu-x86_64: "91fb15094d8f3d9b6a31c58ead7f6b43e45ebbb85ef09804a54529a32fa48006"
      linux-musl-x86_64: "735b8a558a2b6124d0b43f08f825351eca4706ef4b68fb595f98334b695d546d"
      macos-arm64: "fc3d002cbdf8891cf228571c2579e42d9baadb6bee165e0f4c5a0fd56a80d07d"
      macos-x86_64: "be334ab6450c0f1a5d9db992444dc094639e9243647beb84b95996cd40ecb62e"
      windows-ucrt64: "101b5980aead90e02cd96c1eb4dab7339bfb9d6d2d09cbf7dda6485ff377f542"
      windows-ucrt-arm64: "23d00d3cd246aa399bfcf89131d45284a0fc974386042aa2c238e1b0bcc8c760"
    tfs:
      linux-gnu-x86_64: "2274ced6bf8361ee4e21946298897a2c46c0d51635b35a17ff237a0fb7b6036e"
      linux-musl-x86_64: "cad93da18a131f8509995abb6fce700f6dc0cafca6f5cf5e4204e482ee644db1"
      macos-arm64: "5c4dfc1d0a04112c7a51cefac68e6f1e50d4096e53c8f4aba2ff33cd9cdd0218"
      macos-x86_64: "3fff01d97565b4d5047e10e5635932101889c9e3156edfa791bd7f28f81fe6ba"
      windows-ucrt64: "7181670bd3e4d7549f033cedad13727bac1697928e66c055a984200c8a5f0109"
      windows-ucrt-arm64: "f31780a64b70f8f4fff6d951502a3083ecc4a61e05401d1a677cda8864e86186"
    link-unit:
      linux-gnu-x86_64: "cb4e3dc7e6d4912dfc5d1e3f37f5477b680660dc173e020c244bf75b71abf6b5"
      linux-musl-x86_64: "aed0c23bdca2d3acf9476eee86cd87f9a2717d235e9d04ca84b384b327aeb570"
      macos-arm64: "8171adaf510ed4dbbf1dedeb50c500192ff75e0085f5b9b5f305b5e05bb3ae3f"
      macos-x86_64: "9e741b217d930f9fcad4d214f3b49344ccdd6b4bc24c301cd9fa9c18ad426251"

# The musl leg's build container line:
# ghcr.io/tamatebako/tpkg-builder-<triplet>:<container_version>, baked by
# tebako-ci-containers. This factory never references the archived v1
# tebako-<platform> images. "v1" is the moving family tag; the immutable
# side is container_digests below. (Only the musl leg containerizes — the
# pinned musl binaries and the staged musl SDK execute only under musl
# libc, so its build + smokes run inside the image, the php/openjdk
# container-leg idiom; the gnu/macos/windows legs are runner-native.)
container_version: "v1"
# The immutable side of the container line (the ruby#381 idiom): the ghcr
# manifest digest per (container x arch), recorded at pin time. ghcr tags
# are MUTABLE, so container_version alone never pins the toolchain — the
# preflight job proves recorded == live (the registry's
# Docker-Content-Digest header) before any leg spends compute, and the
# container legs pull name:tag@digest. A deliberate toolchain bump edits
# the tag above AND the digests here in the same commit. Read the live
# digest with ghcr's anonymous-token flow:
#   token=$(curl -fsSL "https://ghcr.io/token?scope=repository:tamatebako/tpkg-builder-<triplet>:pull" | jq -r .token)
#   curl -fsSL -o /dev/null -D - -H "Authorization: Bearer $token" \
#     -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
#     "https://ghcr.io/v2/tamatebako/tpkg-builder-<triplet>/manifests/<tag>" | grep -i docker-content-digest
container_digests:
  tpkg-builder-x86_64-linux-musl:
    amd64: "sha256:92b952976a36c7ef6cde9a0609549e0dbb3ef304cd79bf4caef3c19f9cb1b185"

# The .NET SDK version catalog this factory builds (and will publish, once
# the publish increment lands). The SOURCE PINS (url/sha256 per triplet
# artifact) live in versions.yml — there is no tamatebako source factory
# for .NET (Microsoft ships compiled per-RID SDK builds; this factory
# repacks them), so versions.yml is the source-pin trust anchor;
# check_contract locks catalog <=> versions.yml (a version in one but not
# the other is a config bug).
#
# Set grammar (tebako-runtime-ruby's semantics, via the php factory):
#   catalog — every version this factory builds
#   full    — the tip of every supported line
#   tidy    — the primary smoke set
dotnet:
  catalog: ["10.0.404"]
  full: ["10.0.404"]
  tidy: ["10.0.404"]
