# The ONE per-platform build workflow (tebako-runtime-php's
# _build-platform.yml port, at this factory's repack scope — no
# compile-time signing arms and no publish stage: the legs build nothing
# but the repack; publish lands with its own increment). Called by the
# thin platform triggers (build-<platform>.yml) — never dispatched
# directly.
#
# Stage 0 (parity): the contract gate's driver-source parity arm needs the
#   pinned product release's lib.rs — a raw.githubusercontent.com fetch
#   that flakes under near-simultaneous per-platform reads
#   (tamatebako/tebako-runtime-python#4). ONE dedicated job fetches it
#   (bounded retry inside Fetcher.read_url) and hands it to the compute
#   job as an artifact, so a flaky fetch fails this one retried job
#   instead of a platform's whole compute leg.
# Stage 1 (compute): the contract gate (schema + pins + the parity arm,
#   reading the stage-0 artifact via TEBAKO_DRIVER_SRC — fail-closed
#   exactly as before) runs, then scripts/compute_matrix.rb expands THIS
#   platform's legs under the dispatch filters. Every downstream value
#   flows from these outputs — workflow YAML never hardcodes a version, a
#   tag, or a SHA (ecosystem SSOT invariant). The run's SOURCE_DATE_EPOCH
#   (the HEAD commit's epoch, ruby#381's idiom) is computed here too, so
#   every leg stamps the SAME build timestamp into the image manifest.
# Stage 2 (preflight): the container digest pins (ruby#381's idiom, the
#   php factory's grammar): contract.yml's container_digests must match
#   the registry's CURRENT digest for the tag — per (container x leg
#   arch) — before any leg spends compute; the container legs then pull
#   name:tag@digest, so the toolchain container can never move under the
#   matrix.
# Stage 3 (build): one leg per (.NET SDK x arch) of this platform:
#   tools/build_runtime (fetch + verify -> stage + prune -> image -> pair
#   -> sidecars -> read-back -> extracted smoke) -> tools/boot_smoke (the
#   contract scenarios + the compute-floor) -> the
#   runtime-packages-<os>-<arch>-<dotnet> artifact. The build tooling
#   fetches and sha256-verifies every input itself (the pinned SDK
#   archive off versions.yml, the pinned wrapper / tfs CLI / link unit
#   off contract.yml) — there is NO source-build path for the driver
#   stack here (contract.yml's link_unit_release comment).
#
# Leg shapes (the php/openjdk grammars):
#   linux-gnu    runner-native (ubuntu-24.04 — its image carries ruby,
#                libicu, libssl: the muxer's own deps).
#   linux-musl   the container-leg idiom: the gnu host docker-runs the
#                digest-pinned tpkg-builder-x86_64-linux-musl image per
#                step — the pinned musl binaries (wrapper, tfs) and the
#                staged musl SDK execute only under musl libc, and
#                build_runtime's extracted smoke + the boot smoke execute
#                them. alpine carries no libicu by default (the .NET
#                runtime's one non-baked host dep), so the in-container
#                steps apk-add it — the mirror of the gnu runner's
#                preinstalled libicu74.
#   macos        runner-native (macos-15 / macos-15-intel) with an
#                explicit ruby/setup-ruby (the php grammar: the system
#                ruby is too old for the tooling). NO macOS deployment
#                floor rides here — the floor is a compile-time concern
#                (clang stamps LC_BUILD_VERSION per invocation) and a
#                repack compiles nothing: the wrapper exe + tfs CLI carry
#                the product repo's floor, Microsoft's binaries carry
#                Microsoft's (docs/build-chain.md).
#   windows      runner-native on the openjdk ucrt idiom: the x64 leg
#                (windows-latest) sets up msys2 ucrt64 for bsdtar (GNU
#                tar cannot read the .zip SDK archive; the arm64 leg
#                extracts with the in-box System32 tar.exe), and the
#                build step runs the openjdk closed PATH (the toolchain
#                dirs only, plus the hosted ruby's own dir). The PE/ucrt
#                materialize path IS the boot: exec-cache materializes
#                the image's tree host-real, and the boot smoke scrubs
#                every boot's PATH to the Windows system directories
#                (the audience-rule condition, the python grammar).
#
# The compute-floor (tebako-runtime-python#79's lesson, the php factory's
# shape): every leg runs a fixed pure-compute C# probe timed INSIDE the
# runtime. The macos-x86_64 leg ALONE arms COMPUTE_FLOOR_MODE=warn — the
# live tebako#1095 slow-compute defect on real Intel silicon is the
# product repo's to fix; every other leg keeps the fail-closed default.
# REMOVAL CONDITION: delete the warn arm when tebako#1095 closes.
#
# The cache holds ONLY the sha256-verified downloads (.build/downloads):
# a restored entry re-verifies against the pins on use, so a poisoned or
# stale cache cannot survive a pin bump (the key also carries the pins'
# hashes). save-always: a red boot smoke must never tax the next leg a
# cold re-download (the ruby factory's msys campaign lesson). CACHE_VER
# stays the manual escape hatch.
name: _build-platform

on:
  workflow_call:
    inputs:
      platform:
        description: 'This call''s platform: linux-gnu | linux-musl | macos | windows'
        required: true
        type: string
      dotnet_filter:
        description: 'SDKs: "full", "tidy", "catalog", or comma-separated versions'
        type: string
        default: 'full'
      arch_filter:
        description: 'Arch slice: "all" or an arch (x86_64 | arm64)'
        type: string
        default: 'all'
    outputs:
      run:
        description: '"true" when this platform has legs under the filters'
        value: ${{ jobs.compute.outputs.run }}
      tebako_version:
        description: 'The tebako product line the pairs build against (contract.yml link_unit_release)'
        value: ${{ jobs.compute.outputs.tebako_version }}
      env_matrix:
        description: 'The selected matrix.json rows (+ triplet/asset_platform) as JSON'
        value: ${{ jobs.compute.outputs.env_matrix }}
      dotnet_matrix:
        description: 'The selected .NET SDK versions as JSON'
        value: ${{ jobs.compute.outputs.dotnet_matrix }}

env:
  CACHE_VER: 1

jobs:
  # The parity artifact, fetched ONCE per call: the driver-source parity
  # arm's second representation (the pinned release's lib.rs) off
  # raw.githubusercontent.com — a transient-failure surface that used to
  # ride inside every platform's compute step, where one flake red-ed the
  # whole platform and the ::error:: never reached the log
  # (tamatebako/tebako-runtime-python#4). The fetch retries with backoff
  # (Fetcher.read_url) and names every failed attempt on stderr; the
  # compute job below consumes the artifact, never the network.
  parity:
    name: Fetch the driver parity source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fetch the pinned driver's parity source
        run: bundle exec scripts/check_contract.rb --fetch-parity .build/parity/lib.rs

      - name: Upload the parity source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: driver-parity-src-${{ inputs.platform }}
          path: .build/parity/lib.rs
          retention-days: 1

  compute:
    name: Compute the ${{ inputs.platform }} legs
    needs: parity
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.emit.outputs.run }}
      leg_count: ${{ steps.emit.outputs.leg_count }}
      legs: ${{ steps.emit.outputs.legs }}
      tebako_version: ${{ steps.emit.outputs.tebako_version }}
      env_matrix: ${{ steps.emit.outputs.env_matrix }}
      dotnet_matrix: ${{ steps.emit.outputs.dotnet_matrix }}
      container_version: ${{ steps.emit.outputs.container_version }}
      container_digests: ${{ steps.emit.outputs.container_digests }}
      source_date_epoch: ${{ steps.get-sde.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The source-date epoch below reads the HEAD commit's own time
          # (git log -1 --format=%ct) — full history, never the depth-1
          # default (ruby#381's idiom).
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The parity artifact the stage-0 job fetched — the gate's parity
      # arm reads THIS file (TEBAKO_DRIVER_SRC), never the network.
      - name: Download the parity source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: driver-parity-src-${{ inputs.platform }}
          path: .build/parity

      # The contract gate first: contract.yml against its schema, the
      # catalog resolvable AND cross-locked to versions.yml's source pins,
      # every matrix leg's triplet pinned, AND the driver-source parity
      # arm (the pinned release's TEBAKO_CONTRACT_VERSION vs
      # contract_version) — fail-closed, against the fetched artifact.
      - name: validate the contract
        env:
          TEBAKO_DRIVER_SRC: .build/parity/lib.rs
        run: bundle exec scripts/check_contract.rb

      - id: emit
        env:
          DOTNET_FILTER: ${{ inputs.dotnet_filter }}
          PLATFORM_FILTER: ${{ inputs.platform }}
          ARCH_FILTER: ${{ inputs.arch_filter }}
        run: |
          set -euo pipefail
          legs=$(scripts/compute_matrix.rb)
          count=$(jq '.include | length' <<< "$legs")
          {
            echo "legs=$legs"
            echo "leg_count=$count"
            if [ "$count" -gt 0 ]; then echo "run=true"; else echo "run=false"; fi
            echo "tebako_version=$(scripts/versions --pin link_unit_release)"
            echo "container_version=$(scripts/versions --pin container_version)"
            echo "container_digests=$(ruby -ryaml -rjson -e '
              d = YAML.load_file("contract.yml")["container_digests"]
              abort("contract.yml declares no container_digests") if d.nil? || d.empty?
              print JSON.generate(d)
            ')"
            echo "env_matrix=$(scripts/compute_matrix.rb --format env)"
            echo "dotnet_matrix=$(scripts/compute_matrix.rb --format dotnets)"
          } >> "$GITHUB_OUTPUT"
          # Mirror the plan to the LOG: values written only to
          # $GITHUB_OUTPUT leave no diagnosable record when the legs skip.
          echo "plan (${{ inputs.platform }}): $count legs (sdk=${DOTNET_FILTER} arch=${ARCH_FILTER})"
          jq -r '.include[] | "  \(.dotnet) \(.os)/\(.arch) [\(.triplet)] on \(.host)"' <<< "$legs"

      # The run's build timestamp: ONE value for the whole run — the HEAD
      # commit time — so every leg stamps the SAME SOURCE_DATE_EPOCH into
      # the image manifest's identity.created (the builder honors it;
      # unset falls to epoch 0). The full-history checkout above makes %ct
      # the commit's own time, never the run's wall clock — a same-commit
      # re-run reproduces it (ruby#381's idiom).
      - name: Get the source-date epoch
        id: get-sde
        run: |
          sde=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH for this run: $sde"
          echo "epoch=$sde" >> "$GITHUB_OUTPUT"

  preflight:
    name: Verify the toolchain container digests
    needs: compute
    if: ${{ needs.compute.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every referenced container manifest exists at its recorded digest
        env:
          LEGS: ${{ needs.compute.outputs.legs }}
          CONTAINER_VERSION: ${{ needs.compute.outputs.container_version }}
          CONTAINER_DIGESTS: ${{ needs.compute.outputs.container_digests }}
        run: |
          set -u
          # One record per (container x leg arch): the digest grammar keys
          # docker arch names (amd64/arm64), the legs key x86_64/arm64.
          pairs=$(printf '%s' "$LEGS" | jq -r '.include[] | select(.container != null) | .container + " " + .arch' | sed 's/:[^:]* / /' | sort -u)
          [ -n "$pairs" ] || { echo "no containerized legs; nothing to preflight"; exit 0; }
          missing=0
          while read -r ref arch; do
            [ -n "$ref" ] || continue
            c="${ref#ghcr.io/tamatebako/}"
            case "$arch" in
              x86_64) carch=amd64 ;;
              arm64)  carch=arm64 ;;
              *) echo "::error::unknown leg arch $arch"; missing=1; continue ;;
            esac
            recorded=$(printf '%s' "$CONTAINER_DIGESTS" | jq -r --arg c "$c" --arg a "$carch" '.[$c][$a] // empty')
            if [ -z "$recorded" ]; then
              echo "::error::contract.yml container_digests records no digest for $c/$carch — record the published digest there"
              missing=1
              continue
            fi
            # ghcr's anonymous-token flow (no docker login on this job):
            # the manifest GET's Docker-Content-Digest header is the
            # registry's CURRENT digest for the tag — a retagged image
            # (a toolchain move under an unchanged tag) shows here.
            token=$(curl -fsSL "https://ghcr.io/token?scope=repository:tamatebako/${c}:pull" | jq -r .token) || token=
            live=$(curl -fsSL -o /dev/null -D - \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/tamatebako/${c}/manifests/${CONTAINER_VERSION}" \
              | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p') || live=
            if [ -z "$live" ]; then
              echo "::error::missing toolchain container: ${ref}:${CONTAINER_VERSION}"
              missing=1
            elif [ "$live" != "$recorded" ]; then
              echo "::error::${ref}:${CONTAINER_VERSION} moved: recorded $recorded, live $live — a retagged toolchain container under an unchanged tag; repin contract.yml container_digests only as a reviewed toolchain bump"
              missing=1
            else
              echo "ok: ${ref}:${CONTAINER_VERSION} @ $live"
            fi
          done <<< "$pairs"
          [ "$missing" -eq 0 ] || { echo "::error::preflight failed — publish the containers or fix container_version/container_digests in contract.yml"; exit 1; }

  build:
    name: ${{ matrix.dotnet }} / ${{ matrix.os }}-${{ matrix.arch }}
    needs: [compute, preflight]
    # An unguarded empty matrix poisons the run conclusion. No always()
    # here: a FAILED preflight (a moved toolchain container) must skip
    # the legs outright — the verify job reports it by name.
    if: ${{ needs.compute.outputs.run == 'true' }}
    runs-on: ${{ matrix.host }}
    # A hung leg fails loudly at the cap, never silently (the exec-cache
    # first materialization + the Roslyn compile fixture are the slow
    # scenarios; the windows legs add Defender scanning on top).
    timeout-minutes: 90
    # build_runtime's release-asset fetches ride the GitHub API;
    # unauthenticated calls share the runner NAT's 60/h budget and die on
    # 403 flakes. secrets.GITHUB_TOKEN raises the budget; the container
    # leg forwards it via -e below. SOURCE_DATE_EPOCH is the compute
    # job's run-wide value (ruby#381); the container leg forwards it too.
    # COMPUTE_FLOOR_MODE arms the warn tier on the macos-x86_64 leg ALONE
    # (the header's tebako#1095 block — every other leg fails closed).
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_DATE_EPOCH: ${{ needs.compute.outputs.source_date_epoch }}
      COMPUTE_FLOOR_MODE: ${{ matrix.os == 'macos' && matrix.arch == 'x86_64' && 'warn' || 'fail' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute.outputs.legs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create folder for runtime packages
        run: mkdir -p runtime-packages

      - name: Cache the verified downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/downloads
          key: tebako-dotnet-dl-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('contract.yml', 'versions.yml') }}-v${{ env.CACHE_VER }}
          save-always: true

      # --- provisioning -------------------------------------------------
      # bsdtar is the only msys2 need on the windows x64 leg (the openjdk
      # idiom): the SDK archive is a .zip and GNU tar cannot read it.
      # gcc-libs rides along for any ucrt64 toolchain binary that still
      # wants the gcc-runtime DLLs. The arm64 leg extracts with the
      # in-box System32 tar.exe and sets nothing up.
      - name: Set up MSys2 (ucrt64 bsdtar + gcc runtime)
        if: matrix.os == 'windows' && matrix.arch == 'x86_64'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          install: mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-gcc-libs

      # The macos legs get a modern ruby (the php grammar — the system
      # ruby predates the tooling's floor). The linux-gnu runner's own
      # ruby suffices; the windows runners host ruby on PATH (setup-ruby
      # publishes no windows-arm64 build — tebako run 35501035272).
      - name: Setup Ruby (the build tooling's interpreter)
        if: matrix.os == 'macos'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false

      # --- build --------------------------------------------------------
      # The container legs docker-run the digest-pinned tpkg-builder
      # image per step (the preflight proved the pin). alpine carries no
      # libicu — the .NET runtime's one non-baked host dep (the gnu
      # runner's image carries libicu74; this is its musl mirror) — so
      # the in-container steps install it before the muxer first runs.
      # The chown at the end hands root-written files back to the runner
      # user (the php grammar: root in the container writes root-owned
      # files onto the bind mount).
      - name: Build the runtime pair (container legs)
        if: matrix.container != null
        env:
          CONTAINER_DIGESTS: ${{ needs.compute.outputs.container_digests }}
        run: |
          set -euo pipefail
          c="${{ matrix.container }}"
          name="${c%:*}"
          case "${{ matrix.arch }}" in
            x86_64) carch=amd64 ;;
            arm64)  carch=arm64 ;;
            *) echo "::error::unknown leg arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          digest=$(printf '%s' "$CONTAINER_DIGESTS" | jq -r --arg c "${name#ghcr.io/tamatebako/}" --arg a "$carch" '.[$c][$a] // empty')
          [ -n "$digest" ] || { echo "::error::no recorded container digest for $name/$carch"; exit 1; }
          image="${c}@${digest}"
          echo "Building in $image"
          docker run --rm -e GITHUB_TOKEN -e SOURCE_DATE_EPOCH \
            -v "${{ github.workspace }}:/mnt/w" -w /mnt/w \
            "$image" bash -c '
              set -e
              apk add --no-cache icu
              tools/build_runtime --dotnet "${{ matrix.dotnet }}" --triplet "${{ matrix.triplet }}"
              uid=$(stat -c %u /mnt/w/contract.yml); gid=$(stat -c %g /mnt/w/contract.yml)
              chown -R "$uid:$gid" /mnt/w/.build /mnt/w/runtime-packages 2>/dev/null || true'

      # The windows legs run the openjdk closed PATH: the runner's
      # default PATH carries several stray mingw installs, and keeping
      # them out of DLL/tool resolution removes a whole silent-failure
      # class — the hosted ruby's own dir is re-added (the tooling IS
      # ruby). The x64 leg's msys2 dir is D:-anchored; the arm64 runner
      # is single-disk (C:) and extracts with the in-box System32
      # tar.exe. --tar flows the matrix row's archiver.
      - name: Build the runtime pair (native legs)
        if: matrix.container == null
        run: |
          set -euo pipefail
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            windows-x86_64)
              ruby_dir=$(dirname "$(command -v ruby)")
              export PATH="$ruby_dir:/d/a/_temp/msys64/ucrt64/bin:/c/Program Files/Git/usr/bin:/c/Program Files/Git/cmd:/c/Windows/System32" ;;
            windows-arm64)
              ruby_dir=$(dirname "$(command -v ruby)")
              export PATH="$ruby_dir:/c/Program Files/Git/usr/bin:/c/Program Files/Git/cmd:/c/Windows/System32" ;;
          esac
          tools/build_runtime --dotnet "${{ matrix.dotnet }}" --triplet "${{ matrix.triplet }}" --tar "${{ matrix.tar }}"

      # --- the gates (a red gate fails the leg; the artifact below still
      # ships for diagnostics, but without the leg-complete marker) -------
      # The boot smoke resolves the exe from TEBAKO_RUNTIME_ROOT.
      # COMPUTE_FLOOR_MODE rides the job env (the header's warn-tier
      # block); the container leg forwards it for symmetry even though
      # its legs never arm warn.
      - name: Boot smoke (container legs)
        if: matrix.container != null
        env:
          CONTAINER_DIGESTS: ${{ needs.compute.outputs.container_digests }}
        run: |
          set -euo pipefail
          c="${{ matrix.container }}"
          name="${c%:*}"
          case "${{ matrix.arch }}" in
            x86_64) carch=amd64 ;;
            arm64)  carch=arm64 ;;
            *) echo "::error::unknown leg arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          digest=$(printf '%s' "$CONTAINER_DIGESTS" | jq -r --arg c "${name#ghcr.io/tamatebako/}" --arg a "$carch" '.[$c][$a] // empty')
          [ -n "$digest" ] || { echo "::error::no recorded container digest for $name/$carch"; exit 1; }
          docker run --rm -e COMPUTE_FLOOR_MODE \
            -v "${{ github.workspace }}:/mnt/w" -w /mnt/w \
            "${c}@${digest}" bash -c '
              set -e
              apk add --no-cache icu
              export TEBAKO_RUNTIME_ROOT=runtime-packages
              tools/boot_smoke'

      - name: Boot smoke (native legs)
        if: matrix.container == null
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
        run: tools/boot_smoke

      # The leg-complete marker (tebako-runtime-ruby#190): written only
      # when every gate above passed — a failed step stops the job before
      # this point (default step gating). The diagnostics upload below is
      # always(), so a red leg's partial packages DO ship as an artifact;
      # the marker is what distinguishes them from a complete leg.
      - name: Mark the leg complete
        run: touch runtime-packages/.leg-complete

      # The leg's runtime packages, kept for a week as build evidence AND
      # diagnostics: one artifact per (platform, arch, sdk) leg, immutable
      # across the run's attempts. Uploads even when the build or boot
      # smoke failed (always()) — a red leg's packages are exactly the
      # ones worth diagnosing.
      - name: Upload the runtime packages
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.dotnet }}
          # include-hidden-files: the .leg-complete marker is dot-hidden
          # (upload-artifact excludes dotfiles by default since v4.4).
          include-hidden-files: true
          path: runtime-packages
          retention-days: 7

  # The terminal aggregate — and the branch-protection gate. The build
  # legs are a dynamic matrix whose check names shift with the catalog
  # (a version bump renames every leg), so protection pins this job's
  # stable per-platform check name ("<platform> / all legs green")
  # instead of any leg's. Green means: the contract/matrix computed, the
  # container pins proved, and every emitted leg succeeded; a platform
  # whose filter emits no legs gates on compute alone.
  verify:
    name: all legs green
    needs: [parity, compute, preflight, build]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the legs
        run: |
          set -euo pipefail
          echo "parity:    ${{ needs.parity.result }}"
          echo "compute:   ${{ needs.compute.result }} (run=${{ needs.compute.outputs.run }}, legs=${{ needs.compute.outputs.leg_count }})"
          echo "preflight: ${{ needs.preflight.result }}"
          echo "build:     ${{ needs.build.result }}"
          if [ "${{ needs.compute.result }}" != "success" ]; then
            echo "::error::the contract/matrix computation failed"
            exit 1
