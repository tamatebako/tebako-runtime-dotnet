# The release coordinator (tebako-runtime-r's publish.yml port — itself
# the php factory's port of the ruby factory's grammar — at this
# factory's four platforms). The explicit, operator-facing entry point —
# the three first-class slice shapes:
#   one SDK on every platform  (dotnet_filter=<version>, platform=all)
#   one platform, every SDK    (dotnet_filter=full|tidy|catalog, platform=<one>)
#   one SDK on one platform    (dotnet_filter=<version>, platform=<one>)
# plus the era baseline (dotnet_filter=catalog, platform=all).
#
# Every slice fans out to _build-platform.yml to BUILD, and — spec 13
# §2a's de-rendezvous (tebako-runtime-ruby#161's pattern) — to PUBLISH
# and SIGN from each leg's own publish job (tebako-runtime-ruby#190's
# split): the leg that built a package uploads its write-once names
# (payload + .sha256 sidecars + .manifest.json shard) and signs every
# served name, publishing the bytes the build job handed off as an
# immutable in-run artifact. No shared mutable file exists anymore (the
# monolithic manifest.json / SHA256SUMS.txt are gone: the per-package
# shard IS the release-index entry — the resolver's primary form — and a
# consumer that wants the monolith shape derives it from the shards
# locally), so N legs publish concurrently with zero rendezvous and one
# failed leg no longer blocks the green legs' packages. What remains here
# is the ONE release job per coordinator run: it AUDITS the whole matrix
# against the release (read-only) and renders + lands the registry
# mirror. And a force_rebuild republication passes through the
# prepare-release job first (tebako-runtime-ruby#189): the release OBJECT
# is recreated under the kept tag, so every publish leg is a pure create
# on a free namespace — the per-asset delete→re-upload wedge never gets
# triggered.
#
# The acceptance job closes a publish run (tebako-runtime-r#6's
# coverage): on the macos lanes, install the pair the freshly landed
# registry default names — through the contract-pinned tebako CLI, into
# a scratch TEBAKO_HOME — and execute it (tools/boot_smoke --scenario
# published-pair: --info through the shim, the hello/console compile +
# run probe, the RID arch tripwire). The build-tree smoke cannot see the
# installed flow: what it boots is the freshly built pair off
# TEBAKO_RUNTIME_IMAGE; what a user runs is the registry default's
# bytes, fetched + mounted by the loader and dispatched by the shim —
# tebako-runtime-r#5 (a published macos-arm64 pair that answered
# --version and died on -e) shipped green in the former and died in the
# latter. The macOS lanes carry it for this factory: the installed
# flow's sharpest edges are theirs (Gatekeeper's quarantine path on the
# notarized exe, the exec-cache materialization, the shim dispatch) —
# the same scenario's linux/windows legs are the named follow-up.
#
# Deliberate deviations from the ruby coordinator (the r factory's,
# inherited):
#   - publish defaults to FALSE (ruby: true): publishing is an explicit
#     operator act.
#   - The release job authenticates with the runner GITHUB_TOKEN, not the
#     ruby grammar's `TEBAKO_CI_PAT_TOKEN || GITHUB_TOKEN` preference: the
#     audit mutates only this repo's own release, the runner token's
#     contents:write suffices, and no downstream cascade listens to this
#     factory's releases yet. The registry bot PR is the exception:
#     pushing its branch + opening/auto-merging the PR rides the PAT
#     grammar like ruby's (the runner token's PRs trigger no checks, and
#     main is protected).
name: publish

on:
  workflow_dispatch:
    inputs:
      dotnet_filter:
        description: 'SDKs: "full" (line tips), "tidy", "catalog" (every pinned version), or comma-separated versions'
        type: string
        default: 'full'
      platform:
        description: 'Platform slice: "all" or one of linux-gnu | linux-musl | macos | windows'
        type: string
        default: 'all'
      arch_filter:
        description: 'Optional arch slice within each platform (x86_64 | arm64)'
        type: string
        default: 'all'
      publish:
        description: 'Publish this run''s packages to the release'
        type: boolean
        default: false
      force_rebuild:
        description: 'Republication: recreate the release OBJECT under the kept tag, then publish fresh (tebako-runtime-ruby#189 — the one exception to per-name byte-immutability, and never a per-asset delete)'
        type: boolean
        default: false
      audit:
        description: 'Audit only: verify the release against the expected matrix, no builds/uploads'
        type: boolean
        default: false
      registry_only:
        description: 'Registry only: render + publish the registry from the release as it stands (needs registry_version; no builds, no audit gate)'
        type: boolean
        default: false
      registry_version:
        description: 'The published tebako version to render for (e.g. 2.8.83) — required with registry_only'
        type: string
        default: ''

permissions:
  contents: write
  # The release job's registry bot PR (tebako-runtime-ruby's grammar).
  pull-requests: write

jobs:
  # tebako-runtime-ruby#189: a force_rebuild republication never deletes
  # individual assets — a deleted name 422-blocks re-uploads for hours
  # server-side, and the wedge's scope is the release OBJECT (proven by
  # probe: a fresh object under the same tag accepts the same names
  # immediately). So a forced republication recreates the release object
  # under the kept tag BEFORE any leg publishes; every publish leg on a
  # fresh object is a pure create (the uploader's race-safe create
  # arbitrates the legs' concurrent re-creation). Non-forced runs skip
  # this job entirely (payload assets stay byte-immutable per name).
  prepare-release:
    name: Recreate the release object (force_rebuild)
    runs-on: ubuntu-latest
    if: ${{ !inputs.registry_only && !inputs.audit && inputs.publish && inputs.force_rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete the release object, keeping the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # This factory's release tag IS the pinned product line
          # (contract.yml's link_unit_release — already v-prefixed).
          tag=$(scripts/versions --pin link_unit_release)
          # Idempotent: a missing object is already the recreated state
          # (a re-run after a mid-air death). --cleanup-tag=false (the
          # default, spelled out) keeps the tag on its commit.
          gh release delete "$tag" --yes --cleanup-tag=false 2>/dev/null || \
            echo "no release object for $tag — already the recreated state"
          echo "release object for $tag recreated (tag kept) — every leg's publish is a pure create"

  linux-gnu:
    needs: prepare-release
    # always() + !cancelled(): a SKIPPED prepare-release (the ordinary
    # non-forced publish) must not skip the platform fan-out.
    if: ${{ always() && !cancelled() && !inputs.registry_only && (inputs.platform == 'all' || inputs.platform == 'linux-gnu') }}
    # attestations/id-token ride down to the called workflow's publish
    # job (its SLSA L3 arm): a caller's grants cap the callee's.
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/_build-platform.yml
    with:
      platform: linux-gnu
      dotnet_filter: ${{ inputs.dotnet_filter }}
      arch_filter: ${{ inputs.arch_filter }}
      audit: ${{ inputs.audit }}
      publish: ${{ inputs.publish }}
    secrets: inherit

  linux-musl:
    needs: prepare-release
    if: ${{ always() && !cancelled() && !inputs.registry_only && (inputs.platform == 'all' || inputs.platform == 'linux-musl') }}
    # attestations/id-token ride down to the called workflow's publish
    # job (its SLSA L3 arm): a caller's grants cap the callee's.
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/_build-platform.yml
    with:
      platform: linux-musl
      dotnet_filter: ${{ inputs.dotnet_filter }}
      arch_filter: ${{ inputs.arch_filter }}
      audit: ${{ inputs.audit }}
      publish: ${{ inputs.publish }}
    secrets: inherit

  macos:
    needs: prepare-release
    if: ${{ always() && !cancelled() && !inputs.registry_only && (inputs.platform == 'all' || inputs.platform == 'macos') }}
    # attestations/id-token ride down to the called workflow's publish
    # job (its SLSA L3 arm): a caller's grants cap the callee's.
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/_build-platform.yml
    with:
      platform: macos
      dotnet_filter: ${{ inputs.dotnet_filter }}
      arch_filter: ${{ inputs.arch_filter }}
      audit: ${{ inputs.audit }}
      publish: ${{ inputs.publish }}
    secrets: inherit

  windows:
    needs: prepare-release
    if: ${{ always() && !cancelled() && !inputs.registry_only && (inputs.platform == 'all' || inputs.platform == 'windows') }}
    # attestations/id-token ride down to the called workflow's publish
    # job (its SLSA L3 arm): a caller's grants cap the callee's.
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/_build-platform.yml
    with:
      platform: windows
      dotnet_filter: ${{ inputs.dotnet_filter }}
      arch_filter: ${{ inputs.arch_filter }}
      audit: ${{ inputs.audit }}
      publish: ${{ inputs.publish }}
    secrets: inherit

  # The ONE release job per coordinator run. Spec 13 §2a's de-rendezvous
  # moved the publish into the legs' own publish jobs (write-once per-leg
  # names — no shared release-asset mutation remains); what serializes
  # here is the two duties that need the whole matrix: the AUDIT (every
  # platform's expected names verified against the release, read-only)
  # and the registry render + bot PR (git arbitrates the PR — the
  # concurrency group is politeness now, not correctness). A runner that
  # dies mid-audit never reports, and the job-level group
  # (cancel-in-progress: false) then holds every later audit hostage for
  # the cap — bound it.
  release:
    name: Audit the release + publish the registry
    needs: [linux-gnu, linux-musl, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-runtime-packages
      cancel-in-progress: false
    # Run when the run asked to publish or audit and at least one
    # platform actually built (an audit builds nothing but still computes
    # every selected platform's expectations) — or unconditionally under
    # registry_only, which builds nothing and renders from the release
    # as it stands.
    if: ${{ always() && !cancelled() && (((inputs.publish || inputs.audit) && (needs.linux-gnu.result == 'success' || needs.linux-musl.result == 'success' || needs.macos.result == 'success' || needs.windows.result == 'success')) || inputs.registry_only) }}
    env:
      # Runner GITHUB_TOKEN — the audit mutates only this repo's own
      # release; see the header's deviation note.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The registry bot PR pushes the publish branch — that needs the
          # PAT, not the runner's default token (see the header note).
          token: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Ruby gems
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The audit, per platform that built: the legs' publish jobs already
      # landed their packages, so this job never downloads a byte — it
      # verifies each platform's expected names (payloads, .sha256
      # sidecars, shards, and — on signing-enabled lines — every .asc,
      # spec 09 §5) against the release's own listing, read-only (the
      # gem's uploader under AUDIT_ONLY).
      - name: Audit the release, per platform
        if: ${{ !inputs.registry_only }}
        env:
          AUDIT_ONLY: "true"
          TEBAKO_RELEASE_SIGNING_ENABLED: ${{ vars.TEBAKO_RELEASE_SIGNING_ENABLED }}
          GNU_RUN: ${{ needs.linux-gnu.outputs.run }}
          GNU_VER: ${{ needs.linux-gnu.outputs.tebako_version }}
          GNU_ENV: ${{ needs.linux-gnu.outputs.env_matrix }}
          GNU_DOTNET: ${{ needs.linux-gnu.outputs.dotnet_matrix }}
          MUSL_RUN: ${{ needs.linux-musl.outputs.run }}
          MUSL_VER: ${{ needs.linux-musl.outputs.tebako_version }}
          MUSL_ENV: ${{ needs.linux-musl.outputs.env_matrix }}
          MUSL_DOTNET: ${{ needs.linux-musl.outputs.dotnet_matrix }}
          MAC_RUN: ${{ needs.macos.outputs.run }}
          MAC_VER: ${{ needs.macos.outputs.tebako_version }}
          MAC_ENV: ${{ needs.macos.outputs.env_matrix }}
          MAC_DOTNET: ${{ needs.macos.outputs.dotnet_matrix }}
          WIN_RUN: ${{ needs.windows.outputs.run }}
          WIN_VER: ${{ needs.windows.outputs.tebako_version }}
          WIN_ENV: ${{ needs.windows.outputs.env_matrix }}
          WIN_DOTNET: ${{ needs.windows.outputs.dotnet_matrix }}
        run: |
          set -uo pipefail
          # Audit every platform that built green; THEN fail loudly naming
          # any selected platform that did not — a green platform's audit
          # always runs, and a coverage gap never goes unreported.
          audit_failed=""
          audit_platform() {
            local run="$1" ver="$2" envm="$3" sdks="$4" name="$5"
            if [ "$run" != "true" ]; then
              echo "--- $name did not build this run; skipping its audit"
              return 0
            fi
            echo "=== auditing $name (tebako $ver)"
            TEBAKO_VERSION="$ver" EXPECTED_ENV_MATRIX="$envm" EXPECTED_DOTNET_MATRIX="$sdks" \
              bundle exec tebako-release upload || audit_failed="$audit_failed $name"
          }
          audit_platform "$GNU_RUN"  "$GNU_VER"  "$GNU_ENV"  "$GNU_DOTNET"  linux-gnu
          audit_platform "$MUSL_RUN" "$MUSL_VER" "$MUSL_ENV" "$MUSL_DOTNET" linux-musl
          audit_platform "$MAC_RUN"  "$MAC_VER"  "$MAC_ENV"  "$MAC_DOTNET"  macos
          audit_platform "$WIN_RUN"  "$WIN_VER"  "$WIN_ENV"  "$WIN_DOTNET"  windows
          failed=""
          mark() { # $1=selected? $2=result $3=name
            if [ "$1" = "true" ] && [ "$2" != "success" ] && [ "$2" != "skipped" ]; then
              failed="$failed $3"
            fi
          }
          mark "${{ inputs.platform == 'all' || inputs.platform == 'linux-gnu' }}"  "${{ needs.linux-gnu.result }}"  linux-gnu
          mark "${{ inputs.platform == 'all' || inputs.platform == 'linux-musl' }}" "${{ needs.linux-musl.result }}" linux-musl
          mark "${{ inputs.platform == 'all' || inputs.platform == 'macos' }}"      "${{ needs.macos.result }}"      macos
          mark "${{ inputs.platform == 'all' || inputs.platform == 'windows' }}"    "${{ needs.windows.result }}"    windows
          if [ -n "$failed" ]; then
            echo "::error::these platforms were selected but did not build green — their packages did not land:$failed"
          fi
          if [ -n "$audit_failed" ]; then
            echo "::error::these platforms' audits FAILED — the release is incomplete:$audit_failed"
          fi
          [ -z "$failed" ] && [ -z "$audit_failed" ]

      # The registry mirror (spec 04 §2): rendered from the release's own
      # shards — the write-once per-leg metadata units, ground truth —
      # never from a job's local knowledge. One tebako version per
      # coordinator run, so the first platform that built names it.
      # always(): a red audit marks the RUN for a human but must not skip
      # the mirror — the render only ever carries what the release itself
      # carries, so mirroring after a partial publish stays truthful (the
      # ruby factory's v0.16.27 lesson: a dogfood death skipped this step
      # and the registry silently lagged the release until hand-rendered).
      - name: Render the registry entries
        if: ${{ always() && !cancelled() && !inputs.audit }}
        env:
          TEBAKO_VERSION: ${{ inputs.registry_only && inputs.registry_version || (needs.linux-gnu.outputs.tebako_version || needs.linux-musl.outputs.tebako_version || needs.macos.outputs.tebako_version || needs.windows.outputs.tebako_version) }}
        run: |
          if [ -z "$TEBAKO_VERSION" ]; then
            echo "::error::registry_only needs registry_version (e.g. 2.8.83) — none given and no platform built one"
            exit 1
          fi
          ./tools/registry_update.rb

      # main is branch-protected: the registry lands by bot PR +
      # auto-merge, never by direct push. Idempotent across re-runs of the
      # same version (an unchanged registry exits before the branch).
      - name: Publish the registry via pull request
        if: ${{ always() && !cancelled() && !inputs.audit }}
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TEBAKO_VERSION: ${{ inputs.registry_only && inputs.registry_version || (needs.linux-gnu.outputs.tebako_version || needs.linux-musl.outputs.tebako_version || needs.macos.outputs.tebako_version || needs.windows.outputs.tebako_version) }}
        run: |
          set -euo pipefail
          [ -f tpkg-registry.yaml ] || { echo "::error::no rendered registry to publish (the render step did not run)"; exit 1; }
          cp tpkg-registry.yaml "$RUNNER_TEMP/registry.yaml"
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          # main can move the registry mid-publish (a mirror PR landing
          # while the matrix builds): the in-tree render would abort the
          # branch checkout below. The temp copy is the payload — discard
          # the dirty tree before branching, restore after (the ruby
          # coordinator's fix, mirrored). First-publish carve-out: a
          # factory that has never published has no tpkg-registry.yaml on
          # main — checkout would die on the pathspec, so the discard is
          # a plain rm there (the render is untracked either way).
          git checkout -- tpkg-registry.yaml 2>/dev/null || rm -f tpkg-registry.yaml
          branch="publish/v${TEBAKO_VERSION}-registry"
          git checkout -b "$branch" origin/main
          cp "$RUNNER_TEMP/registry.yaml" tpkg-registry.yaml
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entries already landed on main)"
            exit 0
          fi
          git add tpkg-registry.yaml
          git commit -m "publish v${TEBAKO_VERSION}: registry entries"
          # force-with-lease on the bot branch: a re-publish re-creates it.
          # The checkout is shallow, so the lease has no expectation for a
          # branch a DIED run left behind — fetch it first or the push is
          # rejected and the mirror never lands. With the tracking ref in
          # place the lease still refuses a concurrent FOREIGN push, as
          # designed.
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"
          # tebako#1050: re-dispatch safety (the ruby coordinator's shape,
          # mirrored). The probe is state-filtered and a probe failure is a
          # named error — a swallowed transport error (a 502 in the lookup)
          # must never read as "no PR", or the create dies on
          # already-exists and a re-dispatch fails deterministically
          # (the python factory's v0.3.5 publish, run 43370376600 attempt 2).
          probe() { gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty'; }
          if ! number="$(probe)"; then
            echo "::error::could not query the open PRs for $branch — refusing to guess (a wrong guess duplicates the PR or strands the render)"
            exit 1
          fi
          if [ -z "$number" ]; then
            body="$RUNNER_TEMP/registry-pr-body.md"
            cat > "$body" <<EOF
          Automated registry entries for v${TEBAKO_VERSION} — rendered from the
          release's per-package .manifest.json shards by tools/registry_update.rb
          (spec 13 §2a's release job; spec 04 §2's mirror). main is protected,
          so the registry lands by PR.
          EOF
            if ! create_out="$(gh pr create --base main --head "$branch" \
                                --title "publish v${TEBAKO_VERSION}: registry entries" \
                                --body-file "$body" 2>&1)"; then
              case "$create_out" in
                *"already exists"*)
                  # The probe→create race (a concurrent attempt opened the
                  # PR between the two): the push above already delivered
                  # the render to the branch the PR tracks.
                  echo "$create_out"
                  ;;
                *)
                  echo "$create_out" >&2
                  exit 1
                  ;;
              esac
            fi
            number="$(probe)" || true
            [ -n "${number:-}" ] || { echo "::error::$branch: the PR was created but could not be re-resolved"; exit 1; }
          else
            echo "registry PR #$number already open for $branch (a re-dispatch) — the force-push healed the head; reusing it"
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"

      # Immediacy, not correctness (tebako-packages/registry#5). The
      # official aggregate polls every six hours, so a publish stays
      # invisible to `tebako install` until the next tick. Fired only AFTER
      # the registry PR is merged (the aggregate reads this feedstock's
      # registry at its default branch); an undeliverable dispatch warns and
      # leaves the cron as the floor.
      - name: Nudge the official registry's aggregate
        if: ${{ always() && !cancelled() && !inputs.audit }}
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN }}
          # The render/publish steps declare this; the nudge died on it
          # (the python factory's v0.3.4 registry_only run 42757685803:
          # "TEBAKO_VERSION: unbound variable" under set -u). Same
          # expression, same source.
          TEBAKO_VERSION: ${{ inputs.registry_only && inputs.registry_version || (needs.linux-gnu.outputs.tebako_version || needs.linux-musl.outputs.tebako_version || needs.macos.outputs.tebako_version || needs.windows.outputs.tebako_version) }}
        run: |
          set -uo pipefail
          branch="publish/v${TEBAKO_VERSION}-registry"
          merged=""
          for _ in $(seq 1 30); do
            merged=$(gh pr list --head "$branch" --state merged --json number --jq '.[0].number // empty' 2>/dev/null || true)
            [ -n "$merged" ] && break
            sleep 10
          done
          if [ -z "$merged" ]; then
            echo "::warning::the registry row is not on main yet — the six-hourly tick catches it"
            exit 0
          fi
          gh api repos/tebako-packages/registry/dispatches \
            -f event_type=feedstock-published \
            -f client_payload[feedstock]="${{ github.repository }}" \
            -f client_payload[tag]="${{ github.ref_name }}" \
            || echo "::warning::the aggregate dispatch failed — the six-hourly tick still catches it"

      - name: Ping the versions catalog
        if: ${{ always() && success() }}
        continue-on-error: true
        # Refreshes www.tebako.org/versions within minutes of a publish
        # (versions plan 05; the daily cron stays the backstop). The org
        # TEBAKO_CI_PAT_TOKEN must carry actions:write on
        # tamatebako/versions for the dispatch — until proven, a failed
        # ping never blocks a release.
        run: gh api repos/tamatebako/versions/dispatches -f event_type=runtime-published
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}

  # The installed-pair acceptance (the header note — tebako-runtime-r#6's
  # coverage, the macOS lanes). One job, gated on the macos fan-out's
  # green publish: a platform that was not selected or did not build
  # green has nothing to accept.
  acceptance-macos:
    name: Acceptance — the installed pair (macos)
    needs: [release, macos]
    if: ${{ always() && !cancelled() && inputs.publish && !inputs.audit && !inputs.registry_only && needs.macos.result == 'success' && needs.macos.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The current arm64 runner — gates the installed pair's boot
          # on the current OS (the exec-cache materialization + the
          # notarized exe's Gatekeeper path + the shim dispatch).
          - { arch: arm64,  host: macos-15 }
          # The Intel runner: the pair must boot without an emulation
          # tax (the scenario's RID tripwire fails a transplanted
          # x86_64-under-Rosetta install by name).
          - { arch: x86_64, host: macos-15-intel }
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false

      # The acceptance installs what the registry default names — only
      # truthful once the publish's registry row is on main (main is
      # protected; the row lands by bot PR + auto-merge). A timeout is a
      # NAMED failure: installing anyway would test the PREVIOUS
      # release's bytes and report their verdict as this publish's.
      - name: Wait for the registry row on main
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # The tag IS the pinned product line (v-prefixed); the release
          # job's registry branch spells it v${TEBAKO_VERSION} — the
          # same string (tebako_version rides v-less by construction).
          tag=$(scripts/versions --pin link_unit_release)
          branch="publish/${tag}-registry"
          landed=""
          for _ in $(seq 1 60); do
            merged=$(gh pr list --head "$branch" --state merged --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$merged" ]; then
              landed="registry PR #${merged} merged"
              break
            fi
            # Idempotent republication: an unchanged render opens no PR
            # — the rows are already on main. The render's release ref
            # line carries the tag (:v<line> at end of line).
            if gh api "repos/${{ github.repository }}/contents/tpkg-registry.yaml?ref=main" --jq .content 2>/dev/null \
                 | base64 -d | grep -qE ":${tag}[[:space:]]*$"; then
              landed="the registry on main already names ${tag} (no merged PR — an unchanged render)"
              break
            fi
            sleep 10
          done
          if [ -z "$landed" ]; then
            echo "::error::${branch} is not merged and main's registry does not name ${tag} within 10 minutes — installing now would test the PREVIOUS release's bytes"
            exit 1
          fi
          echo "$landed"

      # The contract-pinned tebako product line's CLI drives the install
      # — the same link_unit_release pin the legs' link unit + tfs CLI
      # ride (one product release, one line, proven together).
      # tebako-shim rides beside it: `install` links shims/<name> onto a
      # tebako-shim, and the pair's layout mirrors an installed prefix.
      - name: Fetch + verify the pinned tebako CLI pair
        env:
          PID: macos-${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) shac="shasum -a 256" ;;
            *)      shac="sha256sum" ;;
          esac
          pin=$(ruby -ryaml -e 'puts YAML.load_file("contract.yml")["link_unit_release"]')
          ver="${pin#v}"
          base="https://github.com/tamatebako/tebako/releases/download/${pin}"
          mkdir -p .build/acceptance-cli
          for tool in tebako tebako-shim; do
            asset="${tool}-${ver}-${PID}"
            curl -fsSL --retry 3 -o ".build/acceptance-cli/${asset}" "${base}/${asset}"
            curl -fsSL --retry 3 -o ".build/acceptance-cli/${asset}.sha256" "${base}/${asset}.sha256"
          done
          ( cd .build/acceptance-cli
            $shac -c "tebako-${ver}-${PID}.sha256"
            $shac -c "tebako-shim-${ver}-${PID}.sha256"
            mv "tebako-${ver}-${PID}" tebako
            mv "tebako-shim-${ver}-${PID}" tebako-shim
            chmod +x tebako tebako-shim )
          echo "tebako CLI ${pin} (${PID}) fetched + sha256-verified"

      # Runner-native (the macOS build legs' shape — no container).
      - name: Install the published pair + execute it
        run: |
          set -euo pipefail
          export PATH="$PWD/.build/acceptance-cli:$PATH"
          tools/boot_smoke --scenario published-pair --tebako "$PWD/.build/acceptance-cli/tebako"
